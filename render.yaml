services:
  - type: web
    name: password-manager-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DATABASE
        value: password_manager
      - key: TIDB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://tanshi2003.github.io
      - key: FRONTEND_URL
        value: https://tanshi2003.github.io/Password_Manager/
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
